services:
  # Backend: API Express, se despliega como Web Service usando el Dockerfile que ya existe.
  - type: web
    name: ow2-skill-issue
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: WEB_CONCURRENCY
        value: 1

  # Frontend: se sirve como Static Site (build de Vite), no necesita el Dockerfile de frontend/.
  - type: web
    name: ow2-skill-issue
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # IMPORTANTE: después del primer deploy del backend, reemplazar este valor
      # por la URL pública real que Render le asigna (ver DEPLOY.md paso 4).
      - key: VITE_API_URL
        value: https://ow2-skill-issue.onrender.com/api
