services:
  backend:
    build: ./backend
    container_name: ow2-advisor-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ow2-advisor-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped
